name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true включает Pages для репозитория, если он ещё не включён,
      # и переводит источник на "GitHub Actions" — иначе пришлось бы щёлкать в Settings руками
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # сборки нет: весь проект — index.html без зависимостей, публикуется корень как есть
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
